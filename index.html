<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Manual de Crianza Interactivo | PWA</title>
  
  <!-- CSS Principal -->
  <link rel="stylesheet" href="css/estilo.css">
  
  <!-- Manifest PWA -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Meta para PWA -->
  <meta name="theme-color" content="#4CAF50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CrianzaApp">
  
  <!-- Descripción para SEO y redes -->
  <meta name="description" content="Curso interactivo y dinámico sobre crianza positiva. Incluye estilos de crianza, técnicas, retos diarios, 10 mandamientos, 4 pilares y mucho más.">
  <meta name="keywords" content="crianza, hijos, educación, pwa, curso interactivo, crianza positiva, estilos de crianza">
  <meta name="author" content="Manual de Crianza">
  
  <!-- Favicon básico (opcional, puedes generar uno) -->
  <link rel="icon" type="image/png" href="icons/icon-72.png">
</head>
<body>

  <header>
    <h1>📘 Criar con conciencia</h1>
    <p>Curso interactivo · Dinámico · Para toda la familia</p>
  </header>

  <!-- Navegación principal: TODAS las secciones -->
<nav>
  <button class="tab-btn active" data-tab="curso">📚 Mi curso</button>
</nav>

  <!-- Contenido dinámico (lo llena JavaScript) -->
  <main id="contenido">
    <!-- El contenido se carga desde app.js -->
  </main>

  <footer>
    <p>🌱 PWA - Manual de Crianza Consciente | Instalable y usable sin internet</p>
    <p>💡 Cada reto completado suma puntos en tu sesión. ¡Sigue aprendiendo!</p>
  </footer>

  <!-- Scripts -->
  <script src="js/app.js"></script>
</body>
</html>
